name: Security checks
on:
push:
branches: [main]
pull_request:
schedule:
- cron: &quot;0 6 * * 1&quot; # also every Monday 06:00 UTC, catches new CVEs
workflow_dispatch: # adds a &quot;Run workflow&quot; button
permissions:
contents: read
jobs:
secrets:
name: Secret scan (Gitleaks)
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
with:
fetch-depth: 0 # scan full history, not just the last commit
- uses: gitleaks/gitleaks-action@v2
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
sast:
name: Code scan (Semgrep)
runs-on: ubuntu-latest
container: semgrep/semgrep
steps:
- uses: actions/checkout@v4
- run: semgrep scan --config p/default --config p/secrets --error
deps-and-files:
name: Dependency &amp; config scan (Trivy)
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: aquasecurity/trivy-action@0.28.0
with:
scan-type: fs
scanners: vuln,secret,misconfig # CVEs in deps, secrets, Dockerfile/IaC issues
severity: HIGH,CRITICAL
exit-code: &quot;1&quot; # fail the run on findings
ignore-unfixed: true

