{% extends "base.html" %}{% block body %}
<h1>Sign in</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <p><input name="username" placeholder="username" autofocus></p>
  <p><input name="password" type="password" placeholder="password"></p>
  <p><button>Sign in</button></p>
</form>{% endblock %}
